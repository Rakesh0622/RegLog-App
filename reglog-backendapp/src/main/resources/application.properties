# ============================================================================
# RegLog backend configuration
# ============================================================================

server.port=${PORT:8080}
spring.application.name=reglog-backendapp

# ----------------------------------------------------------------------------
# MySQL
# Local default is localhost:3306/reglog. On Render/Aiven override DB_URL,
# MYSQL_USERNAME and MYSQL_PASSWORD as environment variables.
# ----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reglog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:YOUR_MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ----------------------------------------------------------------------------
# JWT
# Use the JWT_SECRET environment variable in any real environment. The default
# below is a DEVELOPMENT-ONLY fallback so the app can start locally.
# JWT_SECRET must be at least 32 bytes when base64-encoded / raw.
# ----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:dev-only-reglog-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ----------------------------------------------------------------------------
# Cookie
# app.cookie.secure must be true when serving the app over HTTPS.
# ----------------------------------------------------------------------------
app.cookie.secure=${SECURE_COOKIE:false}

# ----------------------------------------------------------------------------
# Actuator (health checks - used by Render)
# ----------------------------------------------------------------------------
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health

# ----------------------------------------------------------------------------
# CORS
# Origins allowed to call this API with credentials (comma separated).
# ----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}